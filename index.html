<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>Solar Superman</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="game">

    <!-- START SCREEN -->
    <div id="startScreen">
      <h1>SOLAR SUPERMAN</h1>
      <p>Fly through the real Solar System.</p>
      <button id="startButton">START FLYING</button>
    </div>

    <!-- HUD -->
    <div id="hud">
      <div id="distanceDisplay">DISTANCE FROM SUN: -- AU</div>

      <div id="energyContainer">
        <div id="energyBar"></div>
      </div>
      <div id="energyPercent">100%</div>
    </div>

    <!-- SPEED BUTTONS -->
    <div id="speedControls">
      <button class="speedButton active chill" data-speed="chill">
        CHILL
      </button>

      <button class="speedButton sonic" data-speed="sonic">
        SONIC
      </button>

      <button class="speedButton poop" data-speed="poop">
        U NEED TO POOP
      </button>
    </div>

    <!-- DISPLAY / POLISH CONTROLS -->
    <div id="displayControls">
      <div class="displayTitle">DISPLAY</div>

      <div class="displayRow">
        <span>LABELS</span>
        <button id="labelsOn" class="miniButton active">ON</button>
        <button id="labelsOff" class="miniButton">OFF</button>
      </div>

      <div class="displayRow">
        <span>ORBITS</span>
        <button id="orbitsOn" class="miniButton active">ON</button>
        <button id="orbitsOff" class="miniButton">OFF</button>
      </div>

      <button id="hideUIButton" class="hideUIButton">
        FULL VIEW
      </button>
    </div>

    <!-- THIS BUTTON STAYS WHEN UI IS HIDDEN -->
    <button id="uiToggleButton">UI</button>

    <!-- CROSSHAIR -->
    <div id="crosshair">
      <div></div>
    </div>

    <!-- PLANET INFO -->
    <div id="planetInfo"></div>

    <!-- PLANET LABELS -->
    <div id="labelLayer"></div>

    <!-- MOBILE CONTROLS -->
    <div id="mobileControls">

      <!-- UP / DOWN -->
      <div id="verticalControls">
        <button id="upButton">▲</button>
        <button id="downButton">▼</button>
      </div>

      <!-- MOVEMENT PAD -->
      <div id="movementPad">
        <button id="moveForward">▲</button>

        <div class="middleMovement">
          <button id="moveLeft">◀</button>
          <button id="moveRight">▶</button>
        </div>

        <button id="moveBackward">▼</button>
      </div>

    </div>

    <!-- THREE.JS -->
    <script type="module" src="app.js"></script>
  </div>
</body>
</html>
