<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="game">
    <div id="loading">
      <div class="loadingTitle">SOLAR EXPLORER</div>
      <div>Loading universe...</div>
    </div>

    <div id="hud">
      <div class="title">SOLAR EXPLORER</div>

      <div class="instructions">
        <b>W A S D</b> — Fly<br>
        <b>SPACE</b> — Up<br>
        <b>SHIFT</b> — Down<br>
        <b>MOUSE</b> — Look around<br>
        <b>CLICK</b> — Lock mouse
      </div>

      <div id="speed">Speed: 0</div>
      <div id="location">Location: Solar System</div>
    </div>

    <div id="crosshair">
      <span></span>
    </div>

    <div id="planetInfo" class="hidden">
      <div id="planetName">Earth</div>
      <div id="planetDistance"></div>
    </div>

    <div id="startScreen">
      <h1>SOLAR EXPLORER</h1>
      <p>Fly freely through the Solar System.</p>
      <button id="startButton">ENTER SPACE</button>
      <small>WASD + Space + Shift + Mouse</small>
    </div>
  </div>

  <script type="module" src="app.js"></script>

</body>
</html>
